<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Azur – Hotel Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#3aa8f8;--bg2:#a56bff;--app:#f4f5fa;--card:#fff;--ink:#14123a;--mut:#8a8fa8;--line:#eceef5;--navy:#1d1b4b;--lime:#b6e23a;--blue:#4a8cf7;--vio:#7c4dff;--ok:#27ae60;--bad:#ef4444;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d4f91;--bg2:#4b2a8f;--app:#12112a;--card:#1b1a3a;--ink:#f1f2fb;--mut:#9a9ec0;--line:#2a2950;--navy:#0d0c24;--field:#232247;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1d4f91;--bg2:#4b2a8f;--app:#12112a;--card:#1b1a3a;--ink:#f1f2fb;--mut:#9a9ec0;--line:#2a2950;--navy:#0d0c24;--field:#232247;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg2) linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;padding:clamp(8px,2vw,28px);-webkit-font-smoothing:antialiased}
.app{display:flex;gap:14px;max-width:1280px;margin:auto;background:var(--app);border-radius:28px;padding:14px;box-shadow:0 30px 80px #1b124a55;animation:in .8s cubic-bezier(.2,.8,.2,1) backwards}
.side{width:196px;flex:none;background:var(--navy);color:#fff;border-radius:20px;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;padding:0 8px 18px}.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--vio));display:grid;place-items:center;font-style:normal;font-size:13px}
.side small{color:#7d80a8;font-size:10px;letter-spacing:.12em;padding:4px 10px 6px}
.nav{display:flex;gap:10px;align-items:center;width:100%;padding:11px 12px;border:0;border-radius:12px;background:none;color:#aeb1d6;font:500 13px inherit;font-family:inherit;text-align:left;cursor:pointer;transition:.3s}
.nav:hover,.nav.on{background:#ffffff1f;color:#fff;transform:translateX(3px)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 0;font-size:12px;color:#aeb1d6}.me b{display:block;color:#fff}.me i{width:32px;height:32px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:var(--navy);font-style:normal;font-weight:800}
main{flex:1;min-width:0;padding:6px 6px 10px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h3{font-size:16px;font-weight:700;margin-right:auto}
.search{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 16px;gap:8px}.search input{border:0;outline:0;background:none;color:var(--ink);font:500 12px inherit;font-family:inherit;width:140px}.search b{width:28px;height:28px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:12px}
.btn{border:0;background:var(--navy);color:#fff;font:600 12px inherit;font-family:inherit;padding:11px 18px;border-radius:99px;cursor:pointer;transition:.3s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #1d1b4b55}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:18px 0 14px;flex-wrap:wrap}.head h1{font-size:24px;font-weight:800}.head p{font-size:12px;color:var(--mut);margin-top:2px}
.pill{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(6,1fr) minmax(250px,1.35fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s;animation:in .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*80ms + 150ms)}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px #4a3fd024}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}
.dark{background:linear-gradient(145deg,#2a2766,#1a1842);color:#fff;border:0}.dark p{font-size:11px;color:#b9bce6}.dark h4{font-size:15px;line-height:1.35;margin:10px 0 14px}.dark h4 b{color:var(--lime)}.dark u{font-size:11px;color:#b9bce6}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:600}.val{font-size:28px;font-weight:800;margin:10px 0 4px;letter-spacing:-.5px}.val sup{font-size:15px;margin-right:2px}.dl{font-size:11px;color:var(--mut)}.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}
.dn-card{grid-column:7;grid-row:1/3;display:flex;flex-direction:column}.dn-card h5,.card h5{font-size:14px;font-weight:700}
.donut{position:relative;width:190px;margin:14px auto}.donut svg{width:100%;display:block}.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:11px;color:var(--mut)}.donut b{font-size:20px;color:var(--ink);font-weight:800}
.lg{list-style:none;padding:0;display:grid;gap:8px;font-size:12px;margin-bottom:12px}.lg li{display:flex;align-items:center;gap:8px;color:var(--mut)}.lg i{width:9px;height:9px;border-radius:50%}.lg b{margin-left:auto;color:var(--ink)}
.btn2{margin-top:auto;border:1px solid var(--line);background:var(--app);color:var(--ink);padding:11px;border-radius:12px;font:600 12px inherit;font-family:inherit;cursor:pointer;transition:.3s}.btn2:hover{background:var(--navy);color:#fff}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.tx:last-child{border:0}.tx i{width:34px;height:34px;border-radius:10px;background:var(--app);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:11px;flex:none}.tx div{flex:1;min-width:0}.tx b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx small{color:var(--mut);font-size:10px}.tx span{text-align:right;font-weight:700}.tx em{display:block;font-style:normal;font-size:10px;font-weight:700;color:var(--ok)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);font-weight:600}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:14px}.g{flex:1;height:100%;display:flex;align-items:flex-end;gap:3px}.b{flex:1;height:0;border-radius:99px;transition:height 1.1s cubic-bezier(.2,.8,.2,1);cursor:pointer}.b:hover{filter:brightness(1.12)}
.mo{display:flex;gap:8px;margin-top:8px;font-size:10px;color:var(--mut);text-align:center}.mo span{flex:1}
.gauge{position:relative;width:200px;margin:6px auto 0}.gauge svg{display:block;width:100%}.gauge div{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:11px;color:var(--mut)}.gauge b{display:block;font-size:30px;color:var(--ink);font-weight:800;line-height:1}
.area{width:100%;height:80px;display:block;margin-top:8px}
.chat{display:flex;flex-direction:column}.log{flex:1;min-height:150px;max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0;scroll-behavior:smooth}
.m{padding:9px 13px;border-radius:14px;font-size:12px;line-height:1.5;max-width:86%;animation:in .4s backwards}.ai{background:var(--app);align-self:flex-start;border-bottom-left-radius:4px}.me2{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{border:1px solid var(--line);background:var(--app);color:var(--ink);font:600 11px inherit;font-family:inherit;padding:6px 11px;border-radius:99px;cursor:pointer;transition:.3s}.chips button:hover{background:var(--lime);color:#1d1b4b;transform:translateY(-2px)}
.inp{display:flex;gap:8px}.inp input{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:99px;padding:10px 16px;font:500 12px inherit;font-family:inherit;outline:0;transition:.3s}.inp input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #4a8cf722}.inp .btn{background:var(--blue)}
@media(max-width:1000px){.side{display:none}.grid{grid-template-columns:repeat(2,1fr)}.grid>*{grid-column:auto!important;grid-row:auto!important}.c4{grid-column:1/-1!important}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.app{padding:10px;border-radius:20px}.search{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body><div class="app">
<aside class="side"><div class="logo"><i>✦</i>Grand Azur</div><small>MENU</small>
<button class="nav on">◈ Overview</button><button class="nav">▥ Statistics</button><button class="nav">☻ Guests</button><button class="nav">▦ Reservations</button><button class="nav">◔ Revenue</button><button class="nav">⇄ Channels</button><button class="nav">⚙ Settings</button>
<div class="me"><i>GM</i><span><b>General Manager</b>Hotel admin</span></div></aside>
<main>
<div class="top"><h3>Hotel Admin ▾</h3><div class="search"><input placeholder="Search here"><b>⌕</b></div><button class="btn" id="go">✦ Ask AI</button></div>
<div class="head"><div><h1>Dashboard</h1><p>Manage sales with care and precision.</p></div><div class="pill" id="per"></div></div>
<section class="grid">
<div class="card dark c2" style="--i:0"><p id="ud"></p><h4 id="uh"></h4><u>See details →</u></div>
<div class="card c2" style="--i:1"><div class="lbl">Total revenue <span>···</span></div><div class="val" id="k1"></div><div class="dl" id="d1"></div></div>
<div class="card c2" style="--i:2"><div class="lbl">RevPAR <span>···</span></div><div class="val" id="k2"></div><div class="dl" id="d2"></div></div>
<div class="card dn-card" style="--i:3"><h5>Revenue by department</h5><div class="donut"><svg viewBox="0 0 190 190" id="dsv"></svg><div><span>Total revenue</span><b id="dt"></b></div></div><ul class="lg" id="dl"></ul><button class="btn2">Guide views</button></div>
<div class="card c3" style="--i:4"><h5>Reservations</h5><div id="tx"></div></div>
<div class="card c3" style="--i:5"><div class="lbl"><h5 style="color:var(--ink)">Revenue</h5><span class="legend"><span><i style="background:var(--blue)"></i>Rooms</span><span><i style="background:var(--lime)"></i>Other</span></span></div><div class="val" id="mr"></div><div class="dl" id="md"></div><div class="bars" id="bars"></div><div class="mo" id="mo"></div></div>
<div class="card c3" style="--i:6"><h5>Occupancy</h5><div class="gauge"><svg viewBox="0 0 200 108"><defs><linearGradient id="lgd"><stop offset="0" stop-color="#d8f26a"/><stop offset="1" stop-color="#7fd13b"/></linearGradient></defs><path d="M20 100A80 80 0 0 1 180 100" pathLength="100" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/><path id="gp" d="M20 100A80 80 0 0 1 180 100" pathLength="100" fill="none" stroke="url(#lgd)" stroke-width="16" stroke-linecap="round" style="stroke-dasharray:0 100;transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1)"/></svg><div><b id="gv"></b>rooms occupied today</div></div><svg class="area" viewBox="0 0 300 80" preserveAspectRatio="none"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6e23a" stop-opacity=".55"/><stop offset="1" stop-color="#b6e23a" stop-opacity="0"/></linearGradient></defs><path id="af" fill="url(#ag)" style="opacity:0;transition:opacity 1.2s .4s"/><path id="al" fill="none" stroke="#7fd13b" stroke-width="2.5" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)"/></svg></div>
<div class="card chat c4" style="--i:7"><h5>Ask your data ✦</h5><div class="log" id="log"></div><div class="chips" id="chips"></div><div class="inp"><input id="q" placeholder="Ask about revenue, RevPAR, channels, guests…"><button class="btn" id="send">Send</button></div></div>
</section></main></div>
<script>
const API_BASE = 'http://localhost:3001/api';
const fallbackData = {"period": "Jan 2026 – Oct 2026", "asof": "Oct 17, 2026", "rev": 7974381.47, "yoy": 0.33553219067449375, "revpar": 220.90522988505748, "revparYoy": -0.6992322292683928, "last": {"label": "Sep 2026", "total": 993268.2, "mom": -21.92942623333703, "occ": 75.3, "adr": 370.57, "revpar": 278.95}, "months": [{"m": "Feb", "room": 158157.0, "other": 298867.86}, {"m": "Mar", "room": 239183.0, "other": 396450.97}, {"m": "Apr", "room": 331113.0, "other": 459887.64}, {"m": "May", "room": 380021.0, "other": 433826.74}, {"m": "Jun", "room": 488439.0, "other": 451917.69999999995}, {"m": "Jul", "room": 649012.0, "other": 496039.54000000004}, {"m": "Aug", "room": 735330.0, "other": 536939.6299999999}, {"m": "Sep", "room": 504218.0, "other": 489050.19999999995}, {"m": "Oct", "room": 203332.0, "other": 263950.55}], "dept": [["Rooms", 3854973.0], ["Food & Beverage", 2210596.74], ["Events & Meetings", 1177880.64], ["Spa & Wellness", 402005.0], ["Transport", 168970.69], ["Minibar & Extras", 159955.4]], "res": [{"n": "Charlotte Willems", "t": "Junior Suite", "ci": "10-15", "co": "10-17", "v": 702.0, "s": "Completed"}, {"n": "Antoine Bernard", "t": "Deluxe Sea View", "ci": "10-10", "co": "10-17", "v": 2030.0, "s": "Completed"}, {"n": "Julia Schneider", "t": "Executive Suite", "ci": "10-14", "co": "10-17", "v": 1506.0, "s": "Completed"}, {"n": "Eline Maes", "t": "Deluxe Sea View", "ci": "10-17", "co": "10-22", "v": 1210.0, "s": "In-house"}, {"n": "Hugo Dubois", "t": "Classic Deluxe", "ci": "10-17", "co": "10-19", "v": 418.0, "s": "In-house"}], "occ": [58.3, 56.7, 63.3, 68.3, 63.3, 58.3, 63.3, 58.3, 60.0, 70.0, 63.3, 70.0, 66.7, 60.0], "ch": [["Direct Website", 2042754.0, 359.96, 8.1], ["Booking.com", 1616118.0, 354.49, 19.2], ["Travel Agency", 1048884.0, 316.41, 7.5], ["Expedia", 845149.0, 357.05, 16.8], ["Corporate", 745103.0, 307.39, 7.5], ["Phone / Email", 675526.0, 367.93, 6.8], ["Tour Operator", 662170.0, 267.54, 5.8], ["Meetings & Events", 431946.0, 293.24, 2.2], ["Walk-in", 333839.0, 402.7, 0.0]], "guests": [["Mariem Gharbi", 38862.1, 12], ["Abdullah Al-Harbi", 31993.8, 6], ["Emily Wilson", 29719.5, 6]]};

let D = fallbackData;
const $ = s => document.querySelector(s), NS = 'http://www.w3.org/2000/svg', raf = f => requestAnimationFrame(() => requestAnimationFrame(f));
const eur = n => '€' + Math.round(n).toLocaleString('de-DE');
const dl = (v, t) => `<span class="${v >= 0 ? 'up' : 'dn'}">${v >= 0 ? '↑ +' : '↓ '}${Number(v).toFixed(1)}%</span> ${t}`;

function renderDashboard(data) {
  D = data;
  $('#per').textContent = D.period + ' ▾';
  $('#ud').textContent = 'Update · ' + D.asof;
  $('#uh').innerHTML = `Revenue is <b>${Math.abs(D.yoy).toFixed(1)}% ${D.yoy >= 0 ? 'up' : 'down'}</b> vs the same period last year`;
  $('#k1').innerHTML = eur(D.rev);
  $('#d1').innerHTML = dl(D.yoy, 'from last year');
  $('#k2').innerHTML = eur(D.revpar);
  $('#d2').innerHTML = dl(D.revparYoy, 'from last year');
  $('#mr').textContent = eur(D.last.total);
  $('#md').innerHTML = dl(D.last.mom, 'from last month · ' + D.last.label);

  // Donut chart
  const C = 2 * Math.PI * 60;
  const cols = ['#1d1b4b', '#7c4dff', '#b6e23a', '#4a8cf7', '#9aa5ff', '#d3d6ef'];
  const tot = D.dept.reduce((a, x) => a + x[1], 0);
  let off = 0;
  $('#dsv').innerHTML = '';
  $('#dl').innerHTML = '';
  D.dept.forEach(([n, v], i) => {
    const l = (v / tot) * C;
    const c = document.createElementNS(NS, 'circle');
    for (const [k, x] of Object.entries({ cx: 95, cy: 95, r: 60, fill: 'none', stroke: cols[i % cols.length], 'stroke-width': 26, transform: 'rotate(-90 95 95)' })) {
      c.setAttribute(k, x);
    }
    c.style.cssText = `stroke-dasharray:0 ${C};stroke-dashoffset:${-off};transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1) ${i * 0.12}s`;
    $('#dsv').append(c);
    raf(() => c.style.strokeDasharray = `${Math.max(l - 2, 0)} ${C}`);
    off += l;
    $('#dl').insertAdjacentHTML('beforeend', `<li><i style="background:${cols[i % cols.length]}"></i>${n}<b>${((v / tot) * 100).toFixed(0)}%</b></li>`);
  });
  $('#dt').textContent = '€' + (tot / 1e6).toFixed(2) + 'M';

  // Bar charts
  const mx = Math.max(...D.months.map(m => m.room));
  $('#bars').innerHTML = '';
  $('#mo').innerHTML = '';
  D.months.forEach(m => {
    const g = document.createElement('div');
    g.className = 'g';
    [[m.room, 'var(--blue)', 'Rooms'], [m.other, 'var(--lime)', 'Other']].forEach(([v, c, n]) => {
      const b = document.createElement('div');
      b.className = 'b';
      b.style.background = c;
      b.title = `${m.m} · ${n}: ${eur(v)}`;
      g.append(b);
      raf(() => b.style.height = Math.max((v / mx) * 100, 4) + '%');
    });
    $('#bars').append(g);
    $('#mo').insertAdjacentHTML('beforeend', `<span>${m.m}</span>`);
  });

  // Transactions / Recent Reservations
  $('#tx').innerHTML = '';
  D.res.forEach(r => $('#tx').insertAdjacentHTML('beforeend', `
    <div class="tx">
      <i>${r.n.split(' ').map(w => w[0]).join('').slice(0, 2)}</i>
      <div><b>${r.n}</b><small>${r.t} · ${r.ci} → ${r.co}</small></div>
      <span>${eur(r.v)}<em style="color:${r.s === 'Completed' ? 'var(--ok)' : r.s === 'In-house' ? 'var(--blue)' : '#f59f00'}">${r.s}</em></span>
    </div>
  `));

  // Occupancy Gauge & Area Line
  const lastOcc = D.occ.length ? D.occ[D.occ.length - 1] : 60;
  $('#gv').textContent = Math.round(lastOcc) + '%';
  raf(() => $('#gp').style.strokeDasharray = lastOcc + ' 100');

  const lo = Math.min(...D.occ) - 5, hi = Math.max(...D.occ) + 5;
  const pts = D.occ.map((v, i) => [i / (D.occ.length - 1) * 300, 76 - (v - lo) / (hi - lo) * 66]);
  const sm = p => p.reduce((d, [x, y], i, a) => i ? d + `C${(a[i - 1][0] + x) / 2} ${a[i - 1][1]} ${(a[i - 1][0] + x) / 2} ${y} ${x} ${y}` : `M${x} ${y}`, '');
  $('#al').setAttribute('d', sm(pts));
  $('#af').setAttribute('d', sm(pts) + 'L300 80L0 80Z');
  raf(() => { $('#al').style.strokeDashoffset = 0; $('#af').style.opacity = 1; });
}

// Fetch live dashboard data from API with fallback
async function initDashboard() {
  try {
    const res = await fetch(`${API_BASE}/dashboard`);
    if (res.ok) {
      const liveData = await res.json();
      console.log('✅ Loaded live hotel data from MongoDB API');
      renderDashboard(liveData);
      return;
    }
  } catch (e) {
    console.info('ℹ️ API offline, using cached snapshot:', e);
  }
  renderDashboard(fallbackData);
}
initDashboard();

// Chat Management
const log = $('#log');
const chatHistory = [];

function say(t, me, toolCalls = null) {
  const d = document.createElement('div');
  d.className = 'm ' + (me ? 'me2' : 'ai');
  log.append(d);

  if (toolCalls && toolCalls.length) {
    const toolsBadge = document.createElement('div');
    toolsBadge.style.cssText = 'font-size:10px;color:var(--vio);margin-bottom:4px;font-weight:700;display:flex;gap:4px;flex-wrap:wrap;';
    toolCalls.forEach(tc => {
      toolsBadge.insertAdjacentHTML('beforeend', `<span style="background:#7c4dff18;padding:2px 6px;border-radius:4px;">✦ ${tc.name}</span>`);
    });
    d.append(toolsBadge);
  }

  const textNode = document.createElement('span');
  d.append(textNode);

  if (me) {
    textNode.textContent = t;
  } else {
    const words = t.split(' ');
    let i = 0;
    const iv = setInterval(() => {
      textNode.textContent = words.slice(0, ++i).join(' ');
      log.scrollTop = log.scrollHeight;
      if (i >= words.length) clearInterval(iv);
    }, 28);
  }
  log.scrollTop = log.scrollHeight;
}

async function ask(q) {
  if (!q.trim()) return;
  say(q, true);
  chatHistory.push({ role: 'user', content: q });
  $('#q').value = '';

  // Try calling real API
  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chatHistory }),
    });

    if (res.ok) {
      const data = await res.json();
      chatHistory.push({ role: 'assistant', content: data.answer });
      say(data.answer, false, data.toolCalls);
      return;
    }
  } catch (err) {
    console.warn('API error, falling back to local heuristic response:', err);
  }

  // Local fallback heuristic response if API/Ollama is not running
  const l = q.toLowerCase();
  const c = D.ch[0], g = D.guests[0];
  let a;
  if (/revpar|adr|occupanc/.test(l)) {
    a = `In ${D.last.label}, RevPAR was ${eur(D.last.revpar)}, ADR ${eur(D.last.adr)} and occupancy ${D.last.occ.toFixed(1)}%.`;
  } else if (/channel|booking|expedia|direct/.test(l)) {
    a = `${c[0]} brings the most room revenue (${eur(c[1])}, ADR ${eur(c[2])}), with a ${c[3]}% cancellation rate.`;
  } else if (/guest|vip|spend/.test(l)) {
    a = `Top guest: ${g[0]}, ${eur(g[1])} over ${g[2]} stays.`;
  } else if (/revenue|department|spa|f&b|food/.test(l)) {
    const tot = D.dept.reduce((sum, x) => sum + x[1], 0);
    a = 'Revenue split: ' + D.dept.slice(0, 4).map(x => `${x[0]} ${((x[1] / tot) * 100).toFixed(0)}%`).join(', ') + '.';
  } else {
    a = 'I can answer about RevPAR, channels, departments and top guests. Connect Ollama and hotel-api to run open-ended live database queries.';
  }

  chatHistory.push({ role: 'assistant', content: a });
  setTimeout(() => say(a, false), 350);
}

say('Hello! Ask me anything about Grand Azur’s sales, guests, and performance.');

['RevPAR last month', 'Best booking channel', 'Top guest', 'Revenue by department'].forEach(t => {
  const b = document.createElement('button');
  b.textContent = t;
  b.onclick = () => ask(t);
  $('#chips').append(b);
});

$('#send').onclick = () => ask($('#q').value);
$('#q').onkeydown = e => e.key === 'Enter' && ask(e.target.value);
$('#go').onclick = () => {
  $('#q').scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => $('#q').focus({ preventScroll: true }), 500);
};

document.querySelectorAll('.nav').forEach(n => n.onclick = () => {
  document.querySelector('.nav.on')?.classList.remove('on');
  n.classList.add('on');
});
</script></body></html>
